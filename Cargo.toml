[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sinescode/fiex"
authors = ["Yaseen <simplenecessarycode@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "signal"] }

# Data parallelism (scan + work-stealing transfer)
rayon = "1.12.0"
crossbeam-channel = "0.5.16"

# Hashing (BLAKE3 — fastest general-purpose hash). The C backend
# needs a C compiler; on cross targets we have one configured in
# the release workflow.
blake3 = "1.8.7"

# xattr (extended attributes). Linux-only at the use sites, but the
# crate builds on macOS too — fine to keep at workspace level.
xattr = "1.6.1"

# FFI declarations for syscall wrappers (copy_file_range, ioctl, etc.)
# The `libc` crate ships a proper `link` attribute on the crate itself,
# which propagates to downstream binaries. Using a bare `extern "C"`
# block does NOT propagate the `-lc` link flag to the final binary,
# so we go through libc.
libc = "0.2"

# CLI parsing
clap = { version = "4.6.6", features = ["derive", "wrap_help", "color", "string"] }

# Config (TOML)
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = "1.0.151"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Time / formatting
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }

# Linear `rich`-style progress bars (in-place updates, everything
# else scrolls).
indicatif = "0.17"

# Cross-platform home/config dir resolution
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
debug = 1
