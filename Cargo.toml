[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/tui",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sinescode/fiex"
authors = ["Yaseen <simplenecessarycode@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "signal"] }

# Data parallelism (scan + work-stealing transfer)
rayon = "1.12.0"
crossbeam-channel = "0.5.16"

# Hashing (BLAKE3 — fastest general-purpose hash). We disable the
# platform-specific C SIMD backend so cross-compilation to aarch64-musl
# doesn't need a cross C toolchain — the pure-Rust backend is plenty
# fast for our use case.
blake3 = { version = "1.8.7", default-features = false }

# CLI parsing
clap = { version = "4.6.6", features = ["derive", "wrap_help", "color", "string"] }

# Config (TOML)
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = "1.0.151"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Filesystem walk + globs
walkdir = "2.5.0"
glob = "0.3.4"

# Platform-specific bits
xattr = "1.6.1"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"] }
cfg-if = "1.0.4"
once_cell = "1.21.4"

# Time / formatting
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }

# Futures (compat glue)
futures = "0.3.34"

# TUI
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
ratatui-crossterm = { version = "0.1.2", features = ["crossterm_0_29"] }
crossterm = "0.29.0"

# Fuzzy matcher for the command palette
nucleo-matcher = "0.3.1"

# Cross-platform home/config dir resolution
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
debug = 1
