[package]
name = "fiex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "fiex — fast, secure file mover/copier"

[[bin]]
name = "fiex"
path = "src/main.rs"

[dependencies]
fiex-engine = { path = "../engine" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
# Linear `rich`-style progress bars.
indicatif = { workspace = true }

[package.metadata.cargo-machete]
# `tracing` is re-exported by `tracing-subscriber` macros; cargo-machete's
# simple text scan doesn't see that. The dep is still required at build time.
ignored = ["tracing"]
