[package]
name = "fiex-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Async, secure file transfer engine for fiex (no UI deps)"

[dependencies]
tokio = { workspace = true }
libc = { workspace = true }
crossbeam-channel = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xattr = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3.20"
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
cc = "1.2"

[package.metadata.cargo-machete]
# `tracing` is a transitive peer of the `tracing` ecosystem crates the
# engine may use in the future; the dep is required at build time
# even if no `tracing::` macro is used yet.
ignored = ["tracing"]
